name: biteguard
description: BiteGuard phone app - live camera, access alerts and face enrollment.
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

# Networking uses dart:io directly, so the `http` package is no longer needed.
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
